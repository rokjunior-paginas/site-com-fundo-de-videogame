<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texto sobre o Vídeo</title>
    
    <!-- Coloquei o CSS direto aqui para garantir que vai carregar -->
    <style>
        /* Tira margens padrão do navegador */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 1. O CONTAINER: Precisa do position: relative e height: 100vh */
        .video-container {
            position: relative; /* Segura os elementos absolutos aqui dentro */
            width: 100%;
            height: 100vh; /* Ocupa 100% da altura da tela */
            display: flex;
            justify-content: center; /* Centraliza o texto na horizontal */
            align-items: center;     /* Centraliza o texto na vertical */
            overflow: hidden;
        }

        /* 2. O VÍDEO: Precisa do position: absolute para não empurrar o texto */
        #bg-video {
            position: absolute;
            top: 50%;     /*0;*/
            left: 50%;     /*0;*/
            min-width: 100%;
            min-height: 100%;
            transform: translate(-50%, -50%); /* Centraliza o vídeo no fundo */
            object-fit: contain;
            z-index: -2; /* Joga o vídeo lá pra trás */
        }

        /* 3. A PELÍCULA ESCURA */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6); /* Preto com 60% de transparência */
            z-index: -1;
        }

        /* 4. O TEXTO: Precisa do z-index positivo para ficar na frente */
        .conteudo {
            position: relative;
            z-index: 1; /* Traz o texto para a FRENTE do vídeo */
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .conteudo h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        /* 5. AS IMAGENS NO CANTO DIREITO */
        .imagens-direita {
            position: fixed; /* Fixas na tela para acompanharem a rolagem */
            top: 20px;       /* Distância do topo */
            right: 20px;     /* Distância da borda direita */
            display: flex;
            flex-direction: column;
            gap: 20px;       /* Espaço entre as imagens */
            z-index: 10;     /* Acima do vídeo e da película */
        }

        .imagens-direita img {
            width: 150px;    /* Largura padrão das imagens da lateral */
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        /* 6. CLASSE ESPECÍFICA PARA DEIXAR A TERCEIRA IMAGEM MENOR EM ALTURA */
        .imagens-direita .img-menor {
            height: 80px;    /* Altere este valor para deixar mais alta ou mais baixa */
            object-fit: cover; /* Evita que a imagem distorça caso force a altura */
        }
    </style>
</head>
<body>

    <!-- CONTAINER DAS IMAGENS NA LATERAL DIREITA -->
    <div class="imagens-direita">
        <img src="Imagem_Site_Typingclub.png" alt="Site Typingclub">
        <img src="Imagem_Site_keybr.png" alt="Site Keybr">
        <img src="Imagem_Site_zty.pe.png" alt="zty.pe" class="img-menor">
    </div>

    <!-- INÍCIO DO CONTAINER (Tudo tem que estar dentro dele!) -->
    <div class="video-container">
        
        <!-- Película Escura -->
        <div class="overlay"></div>
        
        <!-- Vídeo (Substitua o src pelo seu vídeo) -->
        <video autoplay loop muted playsinline id="bg-video">
            <source src="game_youtube.mp4" type="video/mp4">
        </video>

        <!-- O TEXTO DEVE FICAR AQUI DENTRO DO CONTAINER -->
        <div class="conteudo">
            <h1>Bem-vindo ao Jogo</h1>
            <p>Este texto agora está exatamente no meio do vídeo!</p>
        </div>
        
    </div>
    <!-- FIM DO CONTAINER -->

</body>
</html>
